x-php-defaults: &php-defaults
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks: [laravel_network]
  cpus: 0.5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: ghcr.io/pandoracodes/laravel-nginx:latest
    container_name: nginx
    group_add:
      - "82"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ampr_public:/var/www/apps/ampr/public:ro
      - elsam_public:/var/www/apps/elsam/public:ro
    # depends_on:
    #   ampr:
    #    condition: service_healthy
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.25
    networks: [laravel_network]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ampr:
    <<: *php-defaults
    image: ghcr.io/pandoracodes/ampr:latest
    container_name: ampr
    env_file: /home/satella/laravel/env/ampr.env
    volumes:
      - ampr_storage:/var/www/storage
      - ampr_bootstrap_cache:/var/www/bootstrap/cache
      - ampr_public:/shared/public
    mem_limit: 190m
    memswap_limit: 190m
  #    healthcheck:
  #      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
  #     interval: 30s
  #    timeout: 5s
  #    retries: 5
  #    start_period: 20s

  elsam:
    <<: *php-defaults
    image: ghcr.io/pandoracodes/elsam:latest
    container_name: elsam
    env_file: /home/satella/laravel/env/elsam.env
    volumes:
      - elsam_storage:/var/www/storage
      - elsam_bootstrap_cache:/var/www/bootstrap/cache
      - elsam_public:/shared/public
    mem_limit: 190m
    memswap_limit: 190m
    #healthcheck:
    #  test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
    # interval: 30s
    # timeout: 5s
    #retries: 5
    #start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "no" #cause my server using emmc :")
      - --maxmemory
      - "48mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - redis_data:/data
    networks: [laravel_network]
    mem_limit: 80m
    memswap_limit: 80m
    cpus: 0.25
    #  healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 30s
    #   timeout: 5s
    #    retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ampr_storage:
  ampr_bootstrap_cache:
  ampr_public:
  redis_data:
  elsam_storage:
  elsam_bootstrap_cache:
  elsam_public:

networks:
  laravel_network:
    name: laravel_network
    external: true
