opcache.enable=1
opcache.enable_cli=0

; Shared di antara semua worker fpm dalam 1 container, bukan per-worker.
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=7000

; Image immutable (dibuild ulang tiap deploy), jadi aman matikan validasi
; timestamp file -> hemat syscall & sedikit memori.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=0
opcache.fast_shutdown=1

; JIT tidak banyak membantu app web I/O-bound seperti Laravel, tapi
; jika aktif bisa menambah puluhan MB buffer. Matikan untuk hemat memori.
opcache.jit=disable
opcache.jit_buffer_size=0
