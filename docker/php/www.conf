[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; ondemand: worker baru dibuat hanya saat ada request, lalu dimatikan
; setelah idle. Dengan hanya 5 user aktif, ini menghemat memori baseline
; jauh lebih besar dibanding pm=dynamic/static.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 300

; Wajib "no" supaya env dari env_file docker (APP_KEY, DB_*, REDIS_*, dst)
; ikut diteruskan ke proses PHP.
clear_env = no

request_terminate_timeout = 60
catch_workers_output = yes
decorate_workers_output = no

; Log ke stdout/stderr container, bukan file di disk read-only.
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
