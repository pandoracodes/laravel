name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - app: ampr
            path: apps/ampr
          # - app: app2
          #   path: apps/app2
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: linux/arm64
          build-args: |
            APP_PATH=${{ matrix.path }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-arm64

  build-nginx:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/laravel-nginx:latest
          cache-from: type=gha,scope=nginx-arm64
          cache-to: type=gha,mode=max,scope=nginx-arm64

  deploy:
    needs: [build-app, build-nginx]
    runs-on: [self-hosted, stb]
    steps:
      - uses: actions/checkout@v4

      - name: Login ke GHCR (untuk docker compose pull di runner ini)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sync docker-compose.yml ke direktori runtime VPS
        run: |
          mkdir -p /home/satella/laravel
          rsync -a docker-compose.yml /home/satella/laravel/docker-compose.yml

      - name: Pastikan network laravel_network ada
        run: |
          docker network inspect laravel_network >/dev/null 2>&1 \
            || docker network create laravel_network

      - name: Pull image terbaru
        working-directory: /home/satella/laravel
        run: docker compose pull

      - name: Recreate containers
        working-directory: /home/satella/laravel
        run: docker compose up -d --remove-orphans

      - name: Bersihkan image lama
        run: docker image prune -f
